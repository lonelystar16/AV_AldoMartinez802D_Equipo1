# Dataset de EPP de CascoVision (export de Roboflow, 5 clases).
#
# Las rutas son relativas a la carpeta donde vive este YAML, porque Ultralytics
# usa `yaml_file.parent` como raíz del dataset cuando no se declara `path:`.
# Así el entrenamiento funciona desde cualquier directorio de trabajo.
#
# Clases (verificadas por geometria de cajas y revision visual de recortes):
#   0 helmet     - casco sobre la cabeza
#   1 no_helmet  - persona sin casco (caja sobre la cabeza)  [clase negativa]
#   2 no_vest    - persona sin chaleco (caja sobre el torso)  [clase negativa]
#   3 Person     - persona completa; contiene a las demas
#   4 vest       - chaleco reflectante sobre el torso
#
# El dataset no se versiona en Git: son ~440 MB. Ver .gitignore.
# Los splits train/valid/test son disjuntos por nombre de archivo original
# (sin el hash de augmentation de Roboflow).

train: train/images
val: valid/images
test: test/images

nc: 5
names: ['helmet', 'no_helmet', 'no_vest', 'Person', 'vest']
