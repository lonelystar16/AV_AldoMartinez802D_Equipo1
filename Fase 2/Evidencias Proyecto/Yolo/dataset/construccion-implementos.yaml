# Dataset Construction-PPE de Ultralytics (1.426 imágenes: 1.132 train, 143 val,
# 141 test). No se versiona en Git por su tamaño (~258 MB): ver
# "Fase 2/Evidencias Proyecto/Yolo/README.md", sección Dataset.
# Ruta relativa a la raíz del repositorio: el entrenamiento se lanza desde ahí.
path: Fase 2/Evidencias Proyecto/Yolo/dataset
train: images/train # train images (relative to 'path') 1132 images
val: images/val # val images (relative to 'path') 143 images
test: images/test # test images (relative to 'path') 141 images

# Classes
names:
  0: helmet
  1: gloves
  2: vest
  3: boots
  4: goggles
  5: none
  6: Person
  7: no_helmet
  8: no_goggle
  9: no_gloves
  10: no_boots