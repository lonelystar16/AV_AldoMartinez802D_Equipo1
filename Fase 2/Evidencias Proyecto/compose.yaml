# CascoVision: todo el software con un comando (RNF-15).
#
#   cp .env.example .env     # y cambiar los valores "cambiar_esto"
#   docker compose up -d                       # db + api + dashboard + edge
#   docker compose --profile dev up -d --build # ademas, camara RTSP y baliza simuladas
#   dashboard en http://127.0.0.1:8080 (usuario: CASCOVISION_ADMIN_* del .env)
#
# Los Dockerfile se construyen desde la raiz del repositorio (context: ../..)
# porque el lock de uv (pyproject.toml, uv.lock) vive ahi. Diseno: docs/DISENO_DOCKER.md.
name: cascovision

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cascovision}
      POSTGRES_USER: ${POSTGRES_USER:-cascovision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      CASCOVISION_SEED: ${CASCOVISION_SEED:-0}
      # Primer usuario del dashboard; solo se usa al crear la base.
      CASCOVISION_ADMIN_EMAIL: ${CASCOVISION_ADMIN_EMAIL:?Falta CASCOVISION_ADMIN_EMAIL en .env}
      CASCOVISION_ADMIN_PASSWORD: ${CASCOVISION_ADMIN_PASSWORD:?Falta CASCOVISION_ADMIN_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/migraciones:ro
      - ./docker/db/00-migrar.sh:/docker-entrypoint-initdb.d/00-migrar.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: Fase 2/Evidencias Proyecto/docker/api.Dockerfile
    image: cascovision/api:dev
    environment:
      CASCOVISION_STORAGE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cascovision}
      POSTGRES_USER: ${POSTGRES_USER:-cascovision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:?Falta EDGE_API_TOKEN en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      # Aviso por correo al prevencionista (RF-12). SMTP_HOST vacio = sin avisos.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # La evidencia que escribe el agente; la API solo la lee (RF-19).
      - evidencia:/app/Fase 2/Evidencias Proyecto/incidents:ro
    depends_on:
      db:
        condition: service_healthy
    # Solo en este equipo (127.0.0.1), para /docs y pruebas: el dashboard llega a la API
    # por la red interna. En la faena se quita esta linea (AD-07).
    ports:
      - "127.0.0.1:${API_PUERTO:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: Fase 2/Evidencias Proyecto/docker/dashboard.Dockerfile
    image: cascovision/dashboard:dev
    # nginx reenvia /api/ al servicio api por la red interna.
    depends_on:
      - api
    ports:
      - "127.0.0.1:${DASHBOARD_PUERTO:-8080}:80"
    restart: unless-stopped

  edge:
    build:
      context: ../..
      dockerfile: Fase 2/Evidencias Proyecto/docker/edge.Dockerfile
    image: cascovision/edge:dev
    environment:
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:?Falta EDGE_API_TOKEN en .env}
      BALIZA_TOKEN: ${BALIZA_TOKEN:?Falta BALIZA_TOKEN en .env}
      # En la faena: rtsp://usuario:clave@IP:554/... (si no se define, manda "fuente" de edge.json).
      CAMARA_FUENTE: ${CAMARA_FUENTE:-}
    volumes:
      - type: bind
        source: ./docker/edge/config.json
        target: /config/edge.json
        read_only: true
      - type: bind
        source: ./models
        target: /app/Fase 2/Evidencias Proyecto/models
        read_only: true
      - edge-datos:/data/edge
      - evidencia:/app/Fase 2/Evidencias Proyecto/incidents
    # El agente arranca con su config.json si la API no responde (AD-04), asi que no espera
    # a la API. Si la camara aun no esta lista, el proceso termina y restart lo reintenta.
    healthcheck:
      # El agente reescribe ultimo_cuadro.jpg en cada cuadro analizado (1 por segundo).
      test: ["CMD-SHELL", "find /data/edge -name ultimo_cuadro.jpg -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  rtsp-sim:
    profiles: [dev]
    image: bluenviron/mediamtx:1.15.0-ffmpeg
    volumes:
      - ./docker/rtsp-sim.yml:/mediamtx.yml:ro
      - ./docker/rtsp-sim:/video:ro
    restart: unless-stopped

  receptor-sim:
    profiles: [dev]
    build:
      context: ../..
      dockerfile: Fase 2/Evidencias Proyecto/docker/receptor-sim.Dockerfile
    image: cascovision/receptor-sim:dev
    environment:
      BALIZA_TOKEN: ${BALIZA_TOKEN:?Falta BALIZA_TOKEN en .env}
      SIM_ZONE_ID: zona-norte
      SIM_ZONE_NAME: Zona Norte
      SIM_BEACON_ID: baliza-01
    # Estado en http://127.0.0.1:8081/health ("alerting": true mientras suena).
    # Las ordenes recibidas quedan en /data/alerts.jsonl dentro del contenedor.
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  # Buzon de prueba para los correos (RF-12): con SMTP_HOST=mailpit y SMTP_PORT=1025
  # en .env, los avisos se ven en http://127.0.0.1:8025 sin enviar nada afuera.
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  edge-datos:
  evidencia:
