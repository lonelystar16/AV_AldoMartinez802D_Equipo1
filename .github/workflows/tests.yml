
name: CascoVision - Tests

on:
  pull_request:
    branches:
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ejecutar pruebas con pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de la API y pruebas
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Instalar PyTorch para CPU
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias de vision computacional
        run: python -m pip install "ultralytics==8.4.177" "opencv-python>=4.6.0,<5.0" "numpy>=1.24" "lap>=0.5.12"

      - name: Ejecutar pruebas
        run: python -m pytest -v --override-ini="testpaths=tests" --override-ini="pythonpath=src/api"
