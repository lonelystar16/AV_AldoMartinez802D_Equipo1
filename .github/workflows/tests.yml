name: CascoVision - Tests

on:
  pull_request:
    branches:
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ejecutar pruebas con pytest
    runs-on: ubuntu-latest

    # Base desechable para las pruebas de PostgreSQL (cada caso crea y borra su esquema).
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cvtest
          POSTGRES_PASSWORD: cvtest
          POSTGRES_DB: cvtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvtest -d cvtest"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CASCOVISION_TEST_POSTGRES: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: cvtest
      POSTGRES_PASSWORD: cvtest
      POSTGRES_DB: cvtest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias del proyecto
        run: uv sync --locked --group dev

      - name: Instalar PyTorch para CPU
        run: uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Instalar dependencias de vision computacional
        run: uv pip install --python .venv/bin/python ultralytics numpy "opencv-python>=4.11,<5.0"

      - name: Ejecutar pruebas
        run: uv run --locked --no-sync pytest -v

  dashboard:
    name: Compilar el dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto/src/dashboard

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar y compilar
        run: npm ci --no-audit --no-fund && npm run build
